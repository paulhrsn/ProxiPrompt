[project]
name = "proxiprompt-agent"
version = "0.1.0"
description = "ProxiPrompt Fetch.ai uAgent: plan / synthesize / summarize_post REST + ASI:One Chat Protocol"
authors = [
    { name = "Paul Harrison", email = "paulhar@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "uagents>=0.26.0",
    "uagents-core>=0.4.11",
]

[project.scripts]
proxiprompt-agent = "proxiprompt_agent:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
